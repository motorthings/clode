<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-layout demo &mdash; blueprint palette</title>
<style>
:root{--font-mono:'Source Code Pro','SF Mono',Consolas,monospace;}
:root {
  --surface: #ffffff; --surface2: rgb(243, 244, 245); --border-bright: rgb(208, 211, 216);
  --bg: #f4f6fb; --text: #16213a; --text-dim: rgb(92, 100, 117); --text-muted: rgb(148, 153, 164);
  --slate: #475569; --slate-dim: rgba(71, 85, 105, 0.09);
  --secondary: #0891b2; --secondary-dim: rgba(8, 145, 178, 0.09);
  --primary: #3b4fd8; --primary-dim: rgba(59, 79, 216, 0.09);
  --violet: #6d28d9; --violet-dim: rgba(109, 40, 217, 0.09);
  --amber: #b45309; --amber-dim: rgba(180, 83, 9, 0.09);
  --good: #0f766e; --good-dim: rgba(15, 118, 110, 0.09);
}
html.dark:root {
  --surface: #111b30; --surface2: rgb(28, 37, 58); --border-bright: rgb(60, 69, 88);
  --bg: #0b1220; --text: #e6ecf7; --text-dim: rgb(166, 173, 187); --text-muted: rgb(115, 123, 140);
  --slate: #94a3b8; --slate-dim: rgba(148, 163, 184, 0.13);
  --secondary: #22d3ee; --secondary-dim: rgba(34, 211, 238, 0.13);
  --primary: #7d8dff; --primary-dim: rgba(125, 141, 255, 0.13);
  --violet: #a78bfa; --violet-dim: rgba(167, 139, 250, 0.13);
  --amber: #fbbf24; --amber-dim: rgba(251, 191, 36, 0.13);
  --good: #5eead4; --good-dim: rgba(94, 234, 212, 0.13);
}

body{background:var(--bg);color:var(--text);font-family:var(--font-mono);margin:0;padding:32px}
.wrap{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;padding:20px;max-width:1200px;margin:0 auto}
.wrap svg{display:block;width:100%;height:auto}
h1{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin:0 0 6px}
.note{font-size:11px;color:var(--text-dim);margin:10px 0 0;line-height:1.5}
.sv-sec{font-size:11px;font-weight:700;letter-spacing:2px;fill:var(--text-muted);text-transform:uppercase}
.sv-grp{font-size:9.5px;font-weight:700;letter-spacing:1.5px;fill:var(--text-muted);text-transform:uppercase}
.sv-title{font-size:12px;font-weight:700;fill:var(--text);letter-spacing:.3px}
.sv-sub{font-size:9px;fill:var(--text-dim);letter-spacing:.3px}
.sv-arrow{fill:none;stroke:var(--text-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sv-arrow-d{fill:none;stroke:var(--text-muted);stroke-width:2;stroke-dasharray:3 3;stroke-linejoin:round;stroke-linecap:round}
.sv-arrow--strong{fill:none;stroke:var(--secondary);stroke-width:2.75;stroke-linejoin:round;stroke-linecap:round}
.sv-arrow-lbl{font-size:9.5px;fill:var(--text-muted);letter-spacing:.2px}
.sv-box-source{stroke:var(--slate)} .sv-box-t1{stroke:var(--secondary)} .sv-box-t2{stroke:var(--primary)}
.sv-box-loop{stroke:var(--violet)} .sv-box-llm{stroke:var(--amber)} .sv-box-out{stroke:var(--good)}

</style></head><body>

  <linearGradient id="gout" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--good)" stop-opacity="0.1"></stop><stop offset="100%" stop-color="var(--good)" stop-opacity="0.24"></stop></linearGradient>
</defs>
